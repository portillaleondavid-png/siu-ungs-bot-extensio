<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SIU Guaraní Bot - UNGS</title>
  <style>
    body {
      width: 280px;
      font-family: Arial, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
    }
    h2 {
      font-size: 15px;
      margin-top: 0;
      margin-bottom: 10px;
      color: #0056b3;
      text-align: center;
    }
    label {
      font-size: 11px;
      font-weight: bold;
      display: block;
      margin-top: 8px;
    }
    input {
      width: 100%;
      padding: 6px;
      margin-top: 3px;
      font-size: 11px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 12px;
      background-color: #0088cc;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #006699;
    }
    #status {
      font-size: 11px;
      margin-top: 8px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>🎓 SIU UNGS Notifier</h2>

  <label for="token">Telegram Bot Token:</label>
  <input type="text" id="token" placeholder="Ej: 123456:ABC-DEF1234ghIkl">

  <label for="chatId">Telegram Chat ID:</label>
  <input type="text" id="chatId" placeholder="Ej: 8697206408">

  <button id="btnGuardar">💾 Guardar Configuración</button>
  
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
